<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>PatriotBid — Open the app</title
  ><style>
    body {
      margin: 0;
      background: #f6f8fb;
      color: #18253b;
      font: 15px system-ui;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    main {
      background: white;
      border: 1px solid #e7ebf0;
      border-radius: 12px;
      padding: 40px;
      max-width: 440px;
      margin: 24px;
    }
    small {
      color: #2563eb;
      letter-spacing: 2px;
    }
    h1 {
      font-size: 32px;
      letter-spacing: -1px;
    }
    p {
      color: #788292;
      line-height: 1.7;
    }
    code {
      background: #f0f4fb;
      padding: 3px 6px;
      border-radius: 4px;
    }
    a {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      padding: 12px 18px;
      margin-top: 16px;
    }

  <main>
    <small>PATRIOTBID / DLA OPPORTUNITIES</small>
    <h1>Find your next opportunity.</h1>
    <p>
      The working solicitation browser now runs in Next.js, with real DIBBS
      data, search, filters, and saved opportunities.
    </p>
    <p>
      Run <code>npm install</code> and <code>npm run dev</code> from this
      folder.
    </p>
    <a href="http://localhost:3000">Open solicitation browser ↗</a>

</html>
